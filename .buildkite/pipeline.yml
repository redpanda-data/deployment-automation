agents:
  queue: "k8s-builders"

steps:
  - label: aws ubuntu
    key: aws-up-ubuntu
    concurrency_group: aws-ub
    concurrency: 1
    command: DEPLOYMENT_ID=ci-bs-ub-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=ubuntu-focal task ci:aws:rp
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_DEFAULT_REGION
  - label: aws ubuntu tiered
    key: aws-up-ubuntu-tiered
    concurrency_group: aws-ub
    concurrency: 1
    command: DEPLOYMENT_ID=ci-ts-ub-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=ubuntu-focal task ci:aws:rp:tiered
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - REDPANDA_LICENSE
            - AWS_DEFAULT_REGION
  - label: aws ubuntu tiered large
    key: aws-up-ubuntu-ts-large
    concurrency_group: aws-ub
    concurrency: 1
    command: DEPLOYMENT_ID=ci-ts-ub-lg-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=ubuntu-focal INSTANCE_TYPE_AWS=is4gen.4xlarge MACHINE_ARCH=arm64 task ci:aws:rp:tiered
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - REDPANDA_LICENSE
            - AWS_DEFAULT_REGION
  - label: aws fedora
    key: aws-up-fedora
    concurrency_group: aws-fd
    concurrency: 1
    command: DEPLOYMENT_ID=ci-bs-fd-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=41 task ci:aws:rp
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_DEFAULT_REGION
  - label: aws fedora connect
    key: aws-up-fed-con
    concurrency_group: aws-fd-cn
    concurrency: 1
    command: DEPLOYMENT_ID=ci-cn-fd-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=41 task ci:aws:rp:connect
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_DEFAULT_REGION
            - CONNECT_RPM_TOKEN
  - label: aws fedora tiered
    key: aws-up-fedora-tiered
    concurrency_group: aws-fd
    concurrency: 1
    command: DEPLOYMENT_ID=ci-ts-fd-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=41 task ci:aws:rp:tiered
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
