      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - REDPANDA_LICENSE
            - AWS_DEFAULT_REGION
  - label: aws fedora tiered connect
    key: aws-up-fed-cts
    concurrency_group: aws-fd-cn
    concurrency: 1
    command: DEPLOYMENT_ID=ci-ct-fd-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=41 task ci:aws:rp:ts-connect
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
