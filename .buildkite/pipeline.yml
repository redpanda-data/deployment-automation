    command: DEPLOYMENT_ID=ci-sl-fd-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=41 task ci:aws:rp:sasl
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - REDPANDA_LICENSE
            - REDPANDA_SASL_PASSWORD
            - AWS_DEFAULT_REGION
  - label: aws ubuntu sasl
    key: aws-up-ubuntu-sasl
    concurrency_group: aws-sl
    concurrency: 1
    command: DEPLOYMENT_ID=ci-sl-ub-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=ubuntu-focal task ci:aws:rp:sasl
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - REDPANDA_LICENSE
            - REDPANDA_SASL_PASSWORD
            - AWS_DEFAULT_REGION
  - label: aws fedora tiered large
    key: aws-up-fedora-ts-large
    concurrency_group: aws-fd
    concurrency: 1
    command: DEPLOYMENT_ID=ci-ts-fd-lg-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=41 INSTANCE_TYPE_AWS=is4gen.4xlarge MACHINE_ARCH=arm64 task ci:aws:rp:tiered
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - REDPANDA_LICENSE
            - AWS_DEFAULT_REGION
  - label: gcp ubuntu basic
    key: gcp-up-ubuntu
    concurrency_group: gcp-ub
    concurrency: 1
    command: GCP_IMAGE="ubuntu-os-cloud/ubuntu-2204-lts" DEPLOYMENT_ID="ci-bs-ub-`tr -dc a-z0-9 </dev/urandom | head -c 4`" task ci:gcp:rp
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - GCP_CREDS
  - label: gcp ubuntu tiered
    key: gcp-up-ubuntu-tiered
    concurrency_group: gcp-ub
    concurrency: 1
    command: GCP_IMAGE="ubuntu-os-cloud/ubuntu-2204-lts" DEPLOYMENT_ID="ci-ts-ub-`tr -dc a-z0-9 </dev/urandom | head -c 4`" task ci:gcp:rp:tiered
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          pre-exit: task infra:gcp:destroy
          environment:
            - GCP_CREDS
            - REDPANDA_LICENSE
  - label: gcp fedora basic
    key: gcp-up-fedora
    concurrency_group: gcp-fd
    concurrency: 1
    command: GCP_IMAGE="fedora-cloud/fedora-cloud-39" DEPLOYMENT_ID="ci-bs-fd-`tr -dc a-z0-9 </dev/urandom | head -c 4`" task ci:gcp:rp
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - GCP_CREDS
  - label: gcp fedora tiered
    key: gcp-up-fedora-tiered
    concurrency_group: gcp-fd
    concurrency: 1
    command: GCP_IMAGE="fedora-cloud/fedora-cloud-39" DEPLOYMENT_ID="ci-ud-fd-`tr -dc a-z0-9 </dev/urandom | head -c 4`" task ci:gcp:rp:tiered
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - GCP_CREDS
            - REDPANDA_LICENSE
  - label: gcp ubuntu sasl
    key: gcp-up-ubuntu-sasl
    concurrency_group: gcp-ub
    concurrency: 1
    command: GCP_IMAGE="ubuntu-os-cloud/ubuntu-2204-lts" DEPLOYMENT_ID="ci-sl-ub-`tr -dc a-z0-9 </dev/urandom | head -c 4`" task ci:gcp:rp:sasl
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - GCP_CREDS
            - REDPANDA_LICENSE
            - REDPANDA_SASL_PASSWORD
  - label: gcp fedora sasl
    key: gcp-up-fedora-sasl
    concurrency_group: gcp-fd
    concurrency: 1
    command: GCP_IMAGE="fedora-cloud/fedora-cloud-39" DEPLOYMENT_ID="ci-sl-fd-`tr -dc a-z0-9 </dev/urandom | head -c 4`" task ci:gcp:rp:sasl
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - GCP_CREDS
            - REDPANDA_LICENSE
            - REDPANDA_SASL_PASSWORD
  - label: unstable aws fedora sasl
    key: aws-us-fedora-sasl
    concurrency_group: aws-sl
    concurrency: 1
    command: DEPLOYMENT_ID=ci-sl-fd-us-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=41 IS_USING_UNSTABLE=true task ci:aws:rp:sasl
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - REDPANDA_LICENSE
            - REDPANDA_SASL_PASSWORD
            - AWS_DEFAULT_REGION
  - label: unstable aws ubuntu sasl
    key: aws-us-ubuntu-sasl
    concurrency_group: aws-sl
    concurrency: 1
    command: DEPLOYMENT_ID=ci-sl-ub-us-`tr -dc a-z0-9 </dev/urandom | head -c 4` DISTRO=ubuntu-focal IS_USING_UNSTABLE=true task ci:aws:rp:sasl
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - REDPANDA_LICENSE
            - REDPANDA_SASL_PASSWORD
            - AWS_DEFAULT_REGION
  - label: unstable gcp ubuntu sasl
    key: gcp-us-ubuntu-sasl
    concurrency_group: gcp-us
    concurrency: 1
    command: GCP_IMAGE="ubuntu-os-cloud/ubuntu-2204-lts" DEPLOYMENT_ID="ci-sl-ub-us-`tr -dc a-z0-9 </dev/urandom | head -c 4`" IS_USING_UNSTABLE=true task ci:gcp:rp:sasl
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - GCP_CREDS
            - REDPANDA_LICENSE
            - REDPANDA_SASL_PASSWORD
  - label: unstable gcp fedora sasl
    key: gcp-us-fedora-sasl
    concurrency_group: gcp-us
    concurrency: 1
    command: GCP_IMAGE="fedora-cloud/fedora-cloud-39" DEPLOYMENT_ID="ci-sl-fd-us-`tr -dc a-z0-9 </dev/urandom | head -c 4`" IS_USING_UNSTABLE=true task ci:gcp:rp:sasl
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - GCP_CREDS
            - REDPANDA_LICENSE
            - REDPANDA_SASL_PASSWORD

  - label: cleanup aws resources
    key: cleanup-aws
    command: task cleanup:aws:ci
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY
            - AWS_DEFAULT_REGION
            - CI=true
    depends_on:
      - aws-up-ubuntu
      - aws-up-ubuntu-tiered
      - aws-up-ubuntu-ts-large
      - aws-up-fedora
      - aws-up-fed-con
      - aws-up-fedora-tiered
      - aws-up-fed-cts
      - aws-up-fedora-ts-large
      - aws-us-fedora-sasl
      - aws-us-ubuntu-sasl
      - aws-up-fedora-sasl
      - aws-up-ubuntu-sasl
    allow_dependency_failure: true
    soft_fail: true

  - label: cleanup gcp resources
    key: cleanup-gcp
    command: task cleanup:gcp:ci
    plugins:
      - seek-oss/aws-sm#v2.3.2:
          json-to-env:
            - json-key: .
              secret-id: sdlc/prod/buildkite/deployment_automation
      - docker#v5.8.0:
          image: glrp/atgt:latest
          environment:
            - GCP_CREDS
            - GOOGLE_CREDENTIALS_BASE64
            - CI=true
    depends_on:
      - gcp-up-ubuntu
      - gcp-up-ubuntu-tiered
      - gcp-up-fedora
      - gcp-up-fedora-tiered
      - gcp-up-ubuntu-sasl
      - gcp-up-fedora-sasl
      - gcp-us-ubuntu-sasl
      - gcp-us-fedora-sasl
    allow_dependency_failure: true
    soft_fail: true
