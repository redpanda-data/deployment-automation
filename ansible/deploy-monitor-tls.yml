# jmespath is required on the Ansible controller. Install it with `pip3 install --user jmespath`.
# create_demo_certs: when false, disables all activity related to our demo CA
# handle_cert_install: when false, disables all activity related to installing certificates with our role
- name: Set node_exporter_arch based on host architecture
  hosts: redpanda
  tasks:
    - name: Set node_exporter_arch based on host architecture
      ansible.builtin.set_fact:
        rp_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    # Prefetched with retries because GitHub resets connections under
    # concurrent-lane rate limiting (five separate CI lane failures), and the
    # role's own download/latest-lookup hit GitHub per host with no retry.
    # Pinning the version also skips the role's 'latest' GitHub API lookup.
    - name: Prefetch node_exporter tarball with retries
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_pinned_version }}/node_exporter-{{ node_exporter_pinned_version }}.linux-{{ rp_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_pinned_version }}.linux-{{ rp_arch }}.tar.gz"
        mode: "0644"
      register: node_exporter_prefetch
      until: node_exporter_prefetch is succeeded
      retries: 10
      delay: 15
      vars:
        node_exporter_pinned_version: "1.12.1"
    - name: Include geerlingguy nodeexporter
      ansible.builtin.include_role:
        name: geerlingguy.node_exporter
      vars:
        node_exporter_arch: "{{ rp_arch }}"
        node_exporter_version: "1.12.1"
        node_exporter_download_url: "/tmp/node_exporter-1.12.1.linux-{{ rp_arch }}.tar.gz"

- name: Install certs on monitor
  hosts: monitor
  vars:
    handle_cert_install: true
    create_demo_certs: true
    root_ca_dir: "{{ playbook_dir }}/tls/ca"
    ca_cert_file: "tls/ca/ca.crt"
    redpanda_truststore_file: "/etc/redpanda/certs/ca.crt"
    node_cert_file: "tls/certs/{{ansible_hostname}}/node.crt"
  tasks:
    - name: Install and configure CA certs for running tls
      ansible.builtin.include_role:
        name: redpanda.cluster.demo_certs
      tags:
        - install_certs

- name: Install prometheus
  hosts: monitor
  roles:
    - prometheus.prometheus.prometheus
  vars:
    prometheus_scrape_configs:
      - job_name: "redpanda"
        scheme: "https"
        metrics_path: "/public_metrics"
        static_configs:
          - targets: "{{ groups['redpanda'] | default([]) | map('extract', hostvars, 'inventory_hostname') | map('regex_replace', '^(.*)$','\\1:9644') | list  }}"
        tls_config:
          ca_file: "/etc/redpanda/certs/ca.crt"
      - job_name: "node"
        scheme: "https"
        metrics_path: "/metrics"
        static_configs:
          - targets: "{{ groups['redpanda'] | default([]) | map('extract', hostvars, 'inventory_hostname') | map('regex_replace', '^(.*)$','\\1:9100') | list  }}"
      - job_name: "connect"
        metrics_path: "/metrics"
        scheme: "https"
        static_configs:
          - targets: "{{ groups['connect'] | default([]) | map('extract', hostvars, 'inventory_hostname') | map('regex_replace', '^(.*)$','\\1:9404') | list  }}"
        tls_config:
          ca_file: "/etc/redpanda/certs/ca.crt"

- name: Install grafana
  hosts: monitor
  roles:
    - grafana.grafana.grafana
  vars:
    grafana_version: latest
    grafana_security:
      admin_user: admin
      admin_password: "{{ grafana_admin_pass | default('enter_your_secure_password', true) }}"
    grafana_datasources:
      - name: prometheus
        type: prometheus
        access: proxy
        url: 'http://localhost:9090'
        basicAuth: false
    grafana_dashboards:
      - dashboard_id: 1860
        revision_id: 31
        datasource: prometheus
      - dashboard_id: 7496
        revision_id: 1
        datasource: prometheus
      - dashboard_id: 18135
        revision_id: 1
        datasource: prometheus
