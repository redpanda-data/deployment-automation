- name: Stop rpcn service (skip if unit missing)
  hosts: connect
  become: true
  tasks:
    - name: Check if rpcn unit file exists
      stat:
        path: /etc/systemd/system/rpcn-ent.service
      register: rpcn_unit

    - name: Stop rpcn-ent.service when present
      systemd:
        name: rpcn-ent.service
        state: stopped
      when: rpcn_unit.stat.exists
