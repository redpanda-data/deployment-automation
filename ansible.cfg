[defaults]
host_key_checking=False
gathering = smart
display_skipped_hosts = no
forks = 16
collections_path = ./artifacts/collections
roles_path = ./artifacts/roles

[ssh_connection]
pipelining=True
# ConnectionAttempts=30 (~5 min of TCP retry per ssh invocation, ~15 min worst case
# with retries=3) tolerates slow instance boot — arm64 is4gen lanes can take several
# minutes to accept SSH — without masking dead hosts: the old ConnectionAttempts=100
# meant ~50 minutes of silence before the first UNREACHABLE (see build 425).
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=30 -o UserKnownHostsFile=/dev/null
retries = 3
