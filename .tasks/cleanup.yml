version: '3'

vars:
  # Cleanup parameters
  PREFIX: '{{.PREFIX | default "ci-"}}'
  AWS_CLEANUP_REGION: '{{.AWS_CLEANUP_REGION | default "us-east-2,us-west-2"}}'
  GCP_PROJECT_ID: '{{.GCP_PROJECT_ID | default "hallowed-ray-376320"}}'
  MIN_AGE: '{{.MIN_AGE | default ""}}'

# No env block here: included-taskfile env merges into the WHOLE run, and
# these entries clobbered dotenv-supplied credentials globally (the cred
# templates resolve empty before dotenv merges) while exporting the
# comma-joined reaper region list as everyone's AWS_DEFAULT_REGION. The
# reaper gets its regions via --region; credentials flow from process env
# or .env untouched.

tasks:
  aws:
    desc: "Delete AWS CI resources (instances, volumes, SGs, IAM, S3)"
    dir: scripts/cleanup-aws-ci-resources
    cmds:
      - |
        go run main.go \
          --prefix "{{.PREFIX}}" \
          --region "{{.AWS_CLEANUP_REGION}}" \
          {{if .MIN_AGE}}--min-age "{{.MIN_AGE}}"{{end}}

  aws:dry:
    desc: "Dry run - show what AWS resources would be deleted (does not actually delete)"
    dir: scripts/cleanup-aws-ci-resources
    cmds:
      - |
        go run main.go \
          --prefix "{{.PREFIX}}" \
          --region "{{.AWS_CLEANUP_REGION}}" \
          {{if .MIN_AGE}}--min-age "{{.MIN_AGE}}"{{end}} \
          --dry-run

  aws:ci:
    desc: "Delete AWS CI resources (auto-approves without confirmation)"
    dir: scripts/cleanup-aws-ci-resources
    vars:
      # Concurrent builds interleave: another build's lanes may be mid-converge
      # when this build's cleanup fires. 3h > the 2h lane timeout, so nothing a
      # live lane owns can be reaped (build 430's tiered lanes were killed by
      # exactly this). Override MIN_AGE=0 for a full sweep.
      MIN_AGE: '{{.MIN_AGE | default "3h"}}'
    cmds:
      - |
        go run main.go \
          --prefix "{{.PREFIX}}" \
          --region "{{.AWS_CLEANUP_REGION}}" \
          {{if ne .MIN_AGE "0"}}--min-age "{{.MIN_AGE}}"{{end}} \
          --auto-approve

  gcp:
    desc: "Delete GCP CI resources (instances, networks, firewall, storage) - all regions"
    dir: scripts/cleanup-gcp-ci-resources
    cmds:
      - |
        go run main.go \
          --project-id "{{.GCP_PROJECT_ID}}" \
          --prefix "{{.PREFIX}}" \
          {{if .MIN_AGE}}--min-age "{{.MIN_AGE}}"{{end}}

  gcp:dry:
    desc: "Dry run - show what GCP resources would be deleted (does not actually delete)"
    dir: scripts/cleanup-gcp-ci-resources
    cmds:
      - |
        go run main.go \
          --project-id "{{.GCP_PROJECT_ID}}" \
          --prefix "{{.PREFIX}}" \
          {{if .MIN_AGE}}--min-age "{{.MIN_AGE}}"{{end}} \
          --dry-run

  gcp:ci:
    desc: "Delete GCP CI resources (auto-approves, uses base64 creds) - all regions"
    dir: scripts/cleanup-gcp-ci-resources
    vars:
      # Same concurrent-build guard as aws:ci (see comment there).
      MIN_AGE: '{{.MIN_AGE | default "3h"}}'
    cmds:
      - |
        go run main.go \
          --project-id "{{.GCP_PROJECT_ID}}" \
          --prefix "{{.PREFIX}}" \
          {{if ne .MIN_AGE "0"}}--min-age "{{.MIN_AGE}}"{{end}} \
          --auto-approve \
          --use-gcp-creds-base64

  "all:dry":
    desc: "Dry run cleanup for both AWS and GCP"
    cmds:
      - task: aws:dry
      - task: gcp:dry

  "all:ci":
    desc: "Cleanup both AWS and GCP in CI mode (auto-approve)"
    cmds:
      - task: aws:ci
      - task: gcp:ci

  default:
    desc: "Show available cleanup commands"
    silent: true
    cmds:
      - echo "AWS - task cleanup:aws:dry | task cleanup:aws | task cleanup:aws:ci"
      - echo "GCP - task cleanup:gcp:dry | task cleanup:gcp | task cleanup:gcp:ci"
      - echo "Both - task cleanup:all:dry | task cleanup:all:ci"
