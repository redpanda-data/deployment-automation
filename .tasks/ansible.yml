version: '3'

tasks:
  prereqs:
    desc: >-
      Install Ansible collections and roles from requirements.yml, then apply the
      CANDIDATE_COLLECTION_REF pin (see :ansible:collection:pin) so any workflow can test
      a candidate redpanda.cluster branch/version via that one env var without editing
      requirements.yml. Skips when already installed (see :ansible:collection /
      :ansible:role), so it is safe as a dep of any task: it will NOT clobber a collection
      installed by :ansible:collection:override or :ansible:collection:candidate
      mid-workflow. Delete artifacts/collections to force a full reinstall.
    deps: [collection:pin, role]
    cmds:
      - echo "Ansible prerequisites installed"

  collection:
    desc: >-
      Install Ansible collections from requirements.yml. Skipped when the install marker
      is newer than requirements.yml, so upgrade-test phases that swap redpanda.cluster
      (override/candidate) are not silently reverted by later tasks that dep on prereqs.
    deps:
      - :ensure-collections-dir
    cmds:
      - ansible-galaxy collection install -r {{.USER_WORKING_DIR}}/requirements.yml --force -p {{.ANSIBLE_COLLECTIONS_PATH}}
      - touch {{.ANSIBLE_COLLECTIONS_PATH}}/.requirements-installed
    status:
      - test -f {{.ANSIBLE_COLLECTIONS_PATH}}/.requirements-installed
      - test {{.ANSIBLE_COLLECTIONS_PATH}}/.requirements-installed -nt {{.USER_WORKING_DIR}}/requirements.yml

  role:
    desc: >-
      Install Ansible roles from requirements.yml. Skipped when the install marker is
      newer than requirements.yml (same non-clobbering contract as :ansible:collection).
    deps:
      - :ensure-roles-dir
    cmds:
      - ansible-galaxy role install -r {{.USER_WORKING_DIR}}/requirements.yml --force -p {{.ANSIBLE_ROLES_PATH}}
      - touch {{.ANSIBLE_ROLES_PATH}}/.requirements-installed
    status:
      - test -f {{.ANSIBLE_ROLES_PATH}}/.requirements-installed
      - test {{.ANSIBLE_ROLES_PATH}}/.requirements-installed -nt {{.USER_WORKING_DIR}}/requirements.yml

  collection:pin:
    desc: >-
      When CANDIDATE_COLLECTION_REF is set, force-install redpanda.cluster from that ref
      — a git branch (e.g.
      "git+https://github.com/redpanda-data/redpanda-ansible-collection.git,my-branch")
      or a released Galaxy version (e.g. "redpanda.cluster:0.12.0") — on top of the
      requirements.yml collection, so ANY provision workflow can test a candidate
      collection through one env var without editing requirements.yml. No-op when unset.
      Runs once per workflow (run: once) so the repeated :ansible:prereqs deps do not
      re-install and clobber the upgrade test's phase-1 baseline; the upgrade lanes'
      explicit :ansible:collection:override/:candidate steps run afterward and still win.
      Not behind the requirements mtime status marker that gates :ansible:collection, so a
      warm collections cache does not skip the pin.
    run: once
    deps:
      - collection
    vars:
      CANDIDATE_COLLECTION_REF: '{{.CANDIDATE_COLLECTION_REF | default ""}}'
    cmds:
      - |
        if [ -n "{{.CANDIDATE_COLLECTION_REF}}" ]; then
          echo ">> pinning redpanda.cluster -> {{.CANDIDATE_COLLECTION_REF}}"
          ansible-galaxy collection install '{{.CANDIDATE_COLLECTION_REF}}' --force -p {{.ANSIBLE_COLLECTIONS_PATH}}
        else
          echo ">> no CANDIDATE_COLLECTION_REF set; using requirements.yml redpanda.cluster"
        fi

  collection:candidate:
    desc: >-
      Install the candidate redpanda.cluster collection for the upgrade test's phase 2.
      If CANDIDATE_COLLECTION_REF is set, force-install that ref — either a git branch
      (e.g. "git+https://github.com/redpanda-data/redpanda-ansible-collection.git,my-branch")
      or a released Galaxy version (e.g. "redpanda.cluster:0.12.0"). If unset, install
      whatever requirements.yml pins.
    deps:
      - :ensure-collections-dir
    vars:
      CANDIDATE_COLLECTION_REF: '{{.CANDIDATE_COLLECTION_REF | default ""}}'
    cmds:
      - |
        if [ -n "{{.CANDIDATE_COLLECTION_REF}}" ]; then
          echo ">> candidate redpanda.cluster -> {{.CANDIDATE_COLLECTION_REF}}"
          ansible-galaxy collection install '{{.CANDIDATE_COLLECTION_REF}}' --force -p {{.ANSIBLE_COLLECTIONS_PATH}}
        else
          echo ">> candidate redpanda.cluster -> requirements.yml"
          ansible-galaxy collection install -r {{.USER_WORKING_DIR}}/requirements.yml --force -p {{.ANSIBLE_COLLECTIONS_PATH}}
        fi

  collection:override:
    desc: >-
      Force-install the redpanda.cluster collection at a specific git ref or galaxy version,
      overriding whatever requirements.yml pinned. Used by the upgrade test to swap the
      collection under test between phases without re-running the full requirements install.
    deps:
      - :ensure-collections-dir
    vars:
      # e.g. "git+https://github.com/redpanda-data/redpanda-ansible-collection.git,v0.11.1"
      #  or  "redpanda.cluster:0.11.1" for a Galaxy release
      COLLECTION_REF: '{{.COLLECTION_REF}}'
    cmds:
      - echo ">> Overriding redpanda.cluster collection -> {{.COLLECTION_REF}}"
      - ansible-galaxy collection install '{{.COLLECTION_REF}}' --force -p {{.ANSIBLE_COLLECTIONS_PATH}}
