version: '3'

tasks:
  upgrade:capture:baseline:
    desc: Record the baseline broker version on each node (run after the phase-1 baseline install)
    cmds:
      - echo ">> Capturing baseline broker version on all brokers"
      - ansible redpanda -i {{.ANSIBLE_INVENTORY}} --private-key {{.PRIVATE_KEY}} -b -m script -a scripts/upgrade/capture-baseline.sh

  upgrade:sabotage:keyring:
    desc: >-
      Key-rotation fixture: between phases, double the DEB signing keyring (served key twice) so the
      candidate's key-refresh logic is forced down the rotation path: a fingerprint-presence
      gate skips the refresh (first fpr still present) and the upgrade assert then fails the
      byte-identity check; only a whole-keyring comparison refreshes correctly. No-op on RPM hosts.
    cmds:
      - echo ">> Sabotaging DEB signing keyring to force the key-rotation refresh path"
      - ansible redpanda -i {{.ANSIBLE_INVENTORY}} --private-key {{.PRIVATE_KEY}} -b -m script -a scripts/upgrade/sabotage-deb-keyring.sh

  upgrade:seed:
    desc: >-
      Seed a known, countable dataset into the sentinel topic BEFORE the upgrade so the post-upgrade
      assert can detect partial data loss (not just total loss). Produces SEED_COUNT records
      "sentinel-1".."sentinel-N" and verifies they are all readable before proceeding.
    vars:
      UPGRADE_SENTINEL_TOPIC: '{{.UPGRADE_SENTINEL_TOPIC | default "upgrade-sentinel"}}'
      SEED_COUNT: '{{.SEED_COUNT | default "500"}}'
      # TLS lanes pass RPK_EXTRA='-X tls.ca={{.CA_CRT}}'; plaintext lanes leave it empty
      RPK_EXTRA: '{{.RPK_EXTRA | default ""}}'
    cmds:
      - chmod 775 {{.RPK_PATH}}
      - |
        REDPANDA_BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        echo "Seeding {{.SEED_COUNT}} records into {{.UPGRADE_SENTINEL_TOPIC}} before upgrade (brokers: $REDPANDA_BROKERS)"
        # tolerate TOPIC_ALREADY_EXISTS (re-runs) but surface every other create failure
        {{.RPK_PATH}} topic create {{.UPGRADE_SENTINEL_TOPIC}} -p {{.PARTITION_COUNT}} -X brokers=$REDPANDA_BROKERS {{.RPK_EXTRA}} -v \
          || {{.RPK_PATH}} topic describe {{.UPGRADE_SENTINEL_TOPIC}} -X brokers=$REDPANDA_BROKERS {{.RPK_EXTRA}} >/dev/null \
          || { echo "FAIL: could not create or find sentinel topic {{.UPGRADE_SENTINEL_TOPIC}}"; exit 1; }
        seq 1 {{.SEED_COUNT}} | sed 's/^/sentinel-/' | {{.RPK_PATH}} topic produce {{.UPGRADE_SENTINEL_TOPIC}} -X brokers=$REDPANDA_BROKERS {{.RPK_EXTRA}} || exit 1
        # timeout: 'consume -n N' blocks forever when fewer than N records exist — the
        # count check below must see the partial result, not hang the lane
        GOT=$(timeout 120 {{.RPK_PATH}} topic consume {{.UPGRADE_SENTINEL_TOPIC}} -X brokers=$REDPANDA_BROKERS {{.RPK_EXTRA}} -o start -n {{.SEED_COUNT}} -f '%v\n' | grep -c '^sentinel-' || true)
        echo "pre-upgrade sentinel count: $GOT / {{.SEED_COUNT}}"
        [ "$GOT" -eq "{{.SEED_COUNT}}" ] || { echo "FAIL: only seeded $GOT/{{.SEED_COUNT}} records before upgrade"; exit 1; }
        echo "OK: {{.SEED_COUNT}} records present pre-upgrade"

  upgrade:assert:
    desc: >-
      Assert the candidate collection safely re-converged a cluster the last release built:
      per-node repo cutover (AR) + no GPG/signature error + service-active + broker version
      UNCHANGED (RP is pinned across both phases), plus control-plane status and full survival of
      the seeded sentinel dataset.
    vars:
      UPGRADE_SENTINEL_TOPIC: '{{.UPGRADE_SENTINEL_TOPIC | default "upgrade-sentinel"}}'
      SEED_COUNT: '{{.SEED_COUNT | default "500"}}'
      RPK_EXTRA: '{{.RPK_EXTRA | default ""}}'
    cmds:
      - echo ">> Per-node repo / signature / version-stable / service-active assertions"
      - ansible redpanda -i {{.ANSIBLE_INVENTORY}} --private-key {{.PRIVATE_KEY}} -b -m script -a scripts/upgrade/assert-node.sh
      - echo ">> Control-plane status + data survival"
      - chmod 775 {{.RPK_PATH}}
      - |
        REDPANDA_BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        echo "Brokers: $REDPANDA_BROKERS"
        echo "Checking cluster status after collection re-converge"
        {{.RPK_PATH}} cluster status -X brokers=$REDPANDA_BROKERS {{.RPK_EXTRA}} -v || exit 1
      - task: upgrade:sentinel:assert
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}", RPK_EXTRA: "{{.RPK_EXTRA}}"}

  upgrade:sentinel:assert:
    desc: >-
      Every record upgrade:seed wrote to the sentinel topic is still readable, head to tail.
      AFTER names what the records had to survive, for the log.
    vars:
      UPGRADE_SENTINEL_TOPIC: '{{.UPGRADE_SENTINEL_TOPIC | default "upgrade-sentinel"}}'
      SEED_COUNT: '{{.SEED_COUNT | default "500"}}'
      RPK_EXTRA: '{{.RPK_EXTRA | default ""}}'
      AFTER: '{{.AFTER | default "the collection re-converge"}}'
    cmds:
      - |
        REDPANDA_BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        echo "Verifying seeded dataset survived {{.AFTER}}: expect {{.SEED_COUNT}} records in {{.UPGRADE_SENTINEL_TOPIC}}"
        # timeout: 'consume -n N' blocks forever when fewer than N records exist — a hang
        # here would silently mask the exact data-loss case this assert exists to catch
        OUT=$(timeout 120 {{.RPK_PATH}} topic consume {{.UPGRADE_SENTINEL_TOPIC}} -X brokers=$REDPANDA_BROKERS {{.RPK_EXTRA}} -o start -n {{.SEED_COUNT}} -f '%v\n' || true)
        GOT=$(printf '%s\n' "$OUT" | grep -c '^sentinel-' || true)
        echo "sentinel count after {{.AFTER}}: $GOT / {{.SEED_COUNT}}"
        [ "$GOT" -eq "{{.SEED_COUNT}}" ] || { echo "FAIL: expected {{.SEED_COUNT}} sentinel records, got $GOT (data loss across {{.AFTER}})"; exit 1; }
        printf '%s\n' "$OUT" | grep -qx "sentinel-{{.SEED_COUNT}}" \
          || { echo "FAIL: tail record sentinel-{{.SEED_COUNT}} missing after {{.AFTER}}"; exit 1; }
        echo "OK: all {{.SEED_COUNT}} seeded records survived {{.AFTER}} (head..tail intact)"

  cluster:
    desc: Test Redpanda cluster functionality (create topic, produce, consume)
    cmds:
      - chmod 775 {{.RPK_PATH}}
      - echo "Testing cluster with RPK at {{.RPK_PATH}}"
      - |
        REDPANDA_BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        echo "Brokers: $REDPANDA_BROKERS"
        echo "Checking cluster status"
        {{.RPK_PATH}} cluster status -X brokers=$REDPANDA_BROKERS -v || exit 1
        echo "Creating topic {{.TEST_TOPIC_NAME}}"
        {{.RPK_PATH}} topic create {{.TEST_TOPIC_NAME}} -p {{.PARTITION_COUNT}} -X brokers=$REDPANDA_BROKERS -v || exit 1
        echo "Producing to topic"
        echo squirrel | {{.RPK_PATH}} topic produce {{.TEST_TOPIC_NAME}} -X brokers=$REDPANDA_BROKERS -v || exit 1
        echo "Consuming from topic"
        {{.RPK_PATH}} topic consume {{.TEST_TOPIC_NAME}} -X brokers=$REDPANDA_BROKERS -v -o :end | grep squirrel || exit 1

  sasl:enable-on-existing-blocked:
    desc: >-
      Enabling SASL on a running cluster that has no SASL superuser must stop before any
      cluster or node configuration changes: the playbook fails with the collection's
      guard message, the Admin API still answers without credentials, and the cluster
      config still has no superusers.
    cmds:
      - mkdir -p {{.ARTIFACT_DIR}}/logs
      - |
        LOG={{.ARTIFACT_DIR}}/logs/sasl-enable-on-existing.log
        echo ">> Enabling SASL on the existing cluster without a superuser; expecting the guard to stop it"
        if ansible-playbook ansible/provision-cluster-sasl.yml \
            --private-key {{.PRIVATE_KEY}} --inventory {{.ANSIBLE_INVENTORY}} \
            --extra-vars is_using_unstable={{.IS_USING_UNSTABLE}} \
            --extra-vars sasl_user={{.SASL_USER}} --extra-vars sasl_password={{.SASL_PASSWORD}} \
            {{if .RP_VERSION}}--extra-vars redpanda_version={{.RP_VERSION}}{{end}} \
            {{if .RP_INSTALL_STATUS}}--extra-vars redpanda_install_status={{.RP_INSTALL_STATUS}}{{end}} \
            > "$LOG" 2>&1; then
          tail -40 "$LOG"
          echo "FAIL: enabling SASL without a superuser succeeded; the existing-cluster guard did not stop it"
          exit 1
        fi
        if ! grep -q "has no SASL user named '{{.SASL_USER}}'" "$LOG"; then
          tail -40 "$LOG"
          echo "FAIL: the playbook failed, but not at the existing-cluster SASL guard"
          exit 1
        fi
        echo "OK: the guard stopped the run (has no SASL user named '{{.SASL_USER}}')"
      - |
        echo ">> The Admin API must still answer without credentials, with no superusers configured"
        ansible redpanda -i {{.ANSIBLE_INVENTORY}} --private-key {{.PRIVATE_KEY}} -b -m ansible.builtin.shell \
          -a 'set -e; a=$(rpk cluster config get admin_api_require_auth); s=$(rpk cluster config get superusers); echo "admin_api_require_auth=$a superusers=$s"; [ "$a" = false ] && [ "$s" = "[]" ]'
        echo "OK: Admin API unlocked and cluster config unchanged on every broker"

  sasl:upgrade-rolling:
    desc: >-
      Upgrade Redpanda on the SASL cluster (RP_VERSION/RP_INSTALL_STATUS) while counting, once a
      second, the brokers that accept Kafka connections. Fails if the upgrade fails or if more
      than one broker was down at once (the upgrade wasn't rolling).
    cmds:
      - mkdir -p {{.ARTIFACT_DIR}}/logs
      - |
        BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        UPGRADE_LOG={{.ARTIFACT_DIR}}/logs/sasl-upgrade.log
        UP_LOG={{.ARTIFACT_DIR}}/logs/upgrade-brokers-up.log
        STOP={{.ARTIFACT_DIR}}/logs/upgrade-probe.stop
        HOSTS=$(echo "$BROKERS" | tr ',' '\n' | cut -d: -f1)
        WANT=$(echo "$HOSTS" | grep -c .)
        rm -f "$STOP" "$STOP.done"; : > "$UP_LOG"

        # brokers accepting Kafka connections, once a second; each line is "<epoch> <up>"
        ( while [ ! -f "$STOP" ]; do
            up=$(python3 -c 'import socket, sys
        n = 0
        for h in sys.argv[1:]:
            try:
                socket.create_connection((h, 9092), 1).close(); n += 1
            except OSError:
                pass
        print(n)' $HOSTS)
            echo "$(date +%s) $up" >> "$UP_LOG"
            sleep 1
          done
          touch "$STOP.done" ) &
        sleep 5

        echo ">> Upgrading Redpanda while counting the brokers up (log: $UPGRADE_LOG)"
        ansible-playbook ansible/provision-cluster-sasl.yml \
          --private-key {{.PRIVATE_KEY}} --inventory {{.ANSIBLE_INVENTORY}} \
          --extra-vars is_using_unstable={{.IS_USING_UNSTABLE}} \
          --extra-vars sasl_user={{.SASL_USER}} --extra-vars sasl_password={{.SASL_PASSWORD}} \
          {{if .RP_VERSION}}--extra-vars redpanda_version={{.RP_VERSION}}{{end}} \
          {{if .RP_INSTALL_STATUS}}--extra-vars redpanda_install_status={{.RP_INSTALL_STATUS}}{{end}} \
          > "$UPGRADE_LOG" 2>&1
        rc=$?
        sleep 5; touch "$STOP"
        for i in $(seq 30); do [ -f "$STOP.done" ] && break; sleep 1; done
        if [ $rc -ne 0 ]; then tail -60 "$UPGRADE_LOG"; echo "FAIL: the upgrade failed"; exit 1; fi

        samples=$(grep -c . "$UP_LOG" || true); fewest=$(awk 'NR == 1 || $2 < m {m = $2} END {print m + 0}' "$UP_LOG")
        echo "brokers up: $samples samples, fewest $fewest of $WANT"
        if [ "$samples" -lt 10 ] || [ "$fewest" -lt $((WANT - 1)) ]; then
          echo "FAIL: $((WANT - fewest)) of $WANT brokers were down at once during the upgrade; a rolling upgrade takes down one at a time"
          exit 1
        fi
        echo "OK: at most one broker was down at a time during the upgrade"

  sasl:upgraded:
    desc: >-
      After a Redpanda upgrade on the SASL cluster, every broker in the inventory is alive and
      none still runs FROM_VERSION. Reads the broker list through the Admin API as the SASL
      superuser.
    cmds:
      - |
        from=$(echo "{{.FROM_VERSION}}" | sed 's/-[0-9]*$//')
        want=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep -c '^[0-9]')
        out=$(ansible 'redpanda[0]' -i {{.ANSIBLE_INVENTORY}} --private-key {{.PRIVATE_KEY}} -b -m ansible.builtin.shell \
          -a "RPK_USER={{.SASL_USER}} RPK_PASS={{.SASL_PASSWORD}} rpk redpanda admin brokers list") || { echo "$out"; exit 1; }
        echo "$out"
        # the broker table: the rows under the IS-ALIVE header, up to the next blank line
        # (rpk 26.2 adds section titles and a disk table below it, and marks the controller "0*")
        rows=$(echo "$out" | awk '/IS-ALIVE/ {t=1; next} t && !NF {exit} t && /^[0-9]/')
        if [ "$(echo "$rows" | grep -c .)" -ne "$want" ]; then
          echo "FAIL: expected $want brokers in the broker list"; exit 1
        fi
        if echo "$rows" | grep -qvw true; then
          echo "FAIL: a broker is not alive after the upgrade"; exit 1
        fi
        if echo "$rows" | grep -qE "(^|[ v])${from}([ -]|$)"; then
          echo "FAIL: a broker still runs ${from} after the upgrade"; exit 1
        fi
        echo "OK: all $want brokers alive and upgraded from ${from}"

  sasl:create-superuser:
    desc: Create the SASL superuser on a running cluster (Admin API without auth), from one broker
    cmds:
      - >-
        ansible 'redpanda[0]' -i {{.ANSIBLE_INVENTORY}} --private-key {{.PRIVATE_KEY}} -b
        -m ansible.builtin.command
        -a "rpk security user create {{.SASL_USER}} -p {{.SASL_PASSWORD}} --mechanism SCRAM-SHA-256"

  cluster:sasl:
    desc: >-
      Verify SASL enforcement: the superuser can read cluster status and produce/consume,
      and an anonymous client is denied.
    cmds:
      - chmod 775 {{.RPK_PATH}}
      - |
        REDPANDA_BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        echo "Brokers: $REDPANDA_BROKERS"
        SUPER="-X user={{.SASL_USER}} -X pass={{.SASL_PASSWORD}} -X sasl.mechanism=SCRAM-SHA-256"

        echo "Superuser can read cluster status"
        {{.RPK_PATH}} cluster status -X brokers=$REDPANDA_BROKERS $SUPER -v || exit 1

        echo "Anonymous topic creation must be denied"
        if {{.RPK_PATH}} topic create sasl-anon-denied -X brokers=$REDPANDA_BROKERS 2>/dev/null; then
          echo "FAIL: an anonymous client created a topic on a SASL cluster"
          exit 1
        fi

        echo "Superuser creates the test topic (or finds it on a later check)"
        {{.RPK_PATH}} topic create {{.SASL_TEST_TOPIC}} -p 3 -X brokers=$REDPANDA_BROKERS $SUPER \
          || {{.RPK_PATH}} topic describe {{.SASL_TEST_TOPIC}} -X brokers=$REDPANDA_BROKERS $SUPER >/dev/null \
          || exit 1
        echo sasl-squirrel | {{.RPK_PATH}} topic produce {{.SASL_TEST_TOPIC}} -X brokers=$REDPANDA_BROKERS $SUPER || exit 1
        timeout 120 {{.RPK_PATH}} topic consume {{.SASL_TEST_TOPIC}} -X brokers=$REDPANDA_BROKERS $SUPER -o :end -n 1 | grep sasl-squirrel || exit 1
        echo "OK: SASL enforced"

  cluster:tls:
    desc: Test Redpanda cluster with TLS
    cmds:
      - |
        REDPANDA_BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.ANSIBLE_INVENTORY}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        echo "Redpanda Brokers: $REDPANDA_BROKERS"
        echo "TLS Truststore: {{.CA_CRT}}"
        echo "Checking TLS cluster status"
        {{.ARTIFACT_DIR}}/bin/rpk cluster status -X brokers="$REDPANDA_BROKERS" -X tls.ca="{{.CA_CRT}}" -v || exit 1
        echo "Creating topic"
        {{.ARTIFACT_DIR}}/bin/rpk topic create {{.TEST_TOPIC_NAME}} -p {{.PARTITION_COUNT}} -X brokers="$REDPANDA_BROKERS" -X tls.ca="{{.CA_CRT}}" -v || exit 1
        echo "Producing to topic"
        echo squirrels | {{.ARTIFACT_DIR}}/bin/rpk topic produce {{.TEST_TOPIC_NAME}} -X brokers="$REDPANDA_BROKERS" -X tls.ca="{{.CA_CRT}}" -v || exit 1
        echo "Consuming from topic"
        {{.ARTIFACT_DIR}}/bin/rpk topic consume {{.TEST_TOPIC_NAME}} -X brokers="$REDPANDA_BROKERS" -X tls.ca="{{.CA_CRT}}" -v -o :end | grep squirrels || exit 1

  schema:
    desc: Test schema registry
    cmds:
      - |
        REDPANDA_REGISTRY=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:8081/' | paste -sd ',' -)
        echo "Testing schema registry: $REDPANDA_REGISTRY"
        for ip_port in $(echo $REDPANDA_REGISTRY | tr ',' ' '); do curl $ip_port/subjects ; done

  schema:tls:
    desc: Test schema registry with TLS
    cmds:
      - |
        REDPANDA_REGISTRY=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.ANSIBLE_INVENTORY}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:8081/' | paste -sd ',' -)
        echo "Testing schema registry with TLS"
        for ip_port in $(echo $REDPANDA_REGISTRY | tr ',' ' '); do curl $ip_port/subjects -k --cacert "{{.CA_CRT}}"; done

  storage:aws:
    desc: Verify tiered storage in AWS S3
    cmds:
      - aws s3api list-objects-v2 --bucket "{{.BUCKET_NAME}}" --region {{.AWS_DEFAULT_REGION}} --query "Contents[?contains(Key, 'testtopic/')]" --output text | wc -l | xargs -I {} sh -c 'if [ "{}" -ge 1 ]; then exit 0; else echo "testtopic folder not found" && exit 1; fi'

  storage:gcp:
    desc: Verify tiered storage in GCP
    cmds:
      - echo "{{.GCP_CREDS}}" | base64 -d > /tmp/gcp_creds.json
      - export CLOUDSDK_CORE_PROJECT={{.GOOGLE_PROJECT_ID}}
      - gcloud auth activate-service-account --key-file={{.GOOGLE_APPLICATION_CREDENTIALS}} --project={{.GOOGLE_PROJECT_ID}}
      - gcloud storage --project {{.GOOGLE_PROJECT_ID}} ls | grep {{.SIMPLE_BUCKET_NAME}}

  connect:tls:
    desc: Test Connect REST API with TLS client cert
    deps:
      - :cert:client:generate
    cmds:
      - |
        CONNECT_TARGET=$(sed -n '/^\[connect\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | head -n1)
        curl -vvvvv -k --cert ansible/tls/clients/client.crt --key {{.CLIENT_KEY}} --cacert {{.CLIENT_CERT}} -X GET https://$CONNECT_TARGET:8083/connectors

  prometheus:
    desc: Test Prometheus exporter endpoint
    deps:
      - :cert:client:generate
    cmds:
      - |
        PROMETHEUS_EXPORTER_TARGET=$(sed -n '/^\[connect\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | head -n1)
        curl -vvvvv -k --cert ansible/tls/clients/client.crt --key ansible/tls/clients/client.key --cacert ansible/tls/ca/ca.crt -X GET https://$PROMETHEUS_EXPORTER_TARGET:9404/metrics

  spam:
    desc: Produce multiple messages to test topic
    cmds:
      - chmod 775 {{.RPK_PATH}}
      - echo "Spamming {{.SPAM_MESSAGE_COUNT}} messages to topic"
      - |
        REDPANDA_BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        for i in $(seq 1 {{.SPAM_MESSAGE_COUNT}}); do
          echo "squirrel$i" | {{.RPK_PATH}} topic produce {{.TEST_TOPIC_NAME}} -X brokers=$REDPANDA_BROKERS -v || exit 1
        done

  spam:tls:
    desc: Produce multiple messages to test topic with TLS
    cmds:
      - chmod 775 {{.RPK_PATH}}
      - |
        REDPANDA_BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        for i in $(seq 1 {{.SPAM_MESSAGE_COUNT}}); do
          echo "squirrel$i" | {{.RPK_PATH}} topic produce {{.TEST_TOPIC_NAME}} -X brokers=$REDPANDA_BROKERS -X tls.ca="{{.CA_CRT}}" -v || exit 1
        done

  cluster:proxy:
    desc: Test proxied cluster via SSH
    cmds:
      - |
        REDPANDA_BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        CLIENT_SSH_USER=$(sed -n '/\[redpanda\]/,/\[/p' "{{.HOSTS_FILE}}" | grep ansible_user | head -n1 | tr ' ' '\n' | grep ansible_user | cut -d'=' -f2)
        CLIENT_PUBLIC_IP=$(sed -n '/^\[client\]/,/^$$/p' "{{.HOSTS_FILE}}" | grep 'private_ip=' | cut -f1 -d' ')
        echo "Checking proxy cluster status"
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "{{.SSHKEY}}" "$CLIENT_SSH_USER@$CLIENT_PUBLIC_IP" 'rpk cluster status -X brokers="'"$REDPANDA_BROKERS"'" -X tls.ca="{{.PATH_TO_CA_CRT}}" -v' || exit 1
        echo "Creating topic"
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "{{.SSHKEY}}" "$CLIENT_SSH_USER@$CLIENT_PUBLIC_IP" 'rpk topic create {{.TEST_TOPIC_NAME}} -p {{.PARTITION_COUNT}} -X brokers="'"$REDPANDA_BROKERS"'" -X tls.ca="{{.PATH_TO_CA_CRT}}" -v' || exit 1
        echo "Producing to topic"
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "{{.SSHKEY}}" "$CLIENT_SSH_USER@$CLIENT_PUBLIC_IP" 'echo squirrels | rpk topic produce {{.TEST_TOPIC_NAME}} -X brokers="'"$REDPANDA_BROKERS"'" -X tls.ca="{{.PATH_TO_CA_CRT}}" -v' || exit 1
        sleep 30
        echo "Consuming from topic"
        testoutput=$(ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i "{{.SSHKEY}}" "$CLIENT_SSH_USER@$CLIENT_PUBLIC_IP" 'rpk topic consume {{.TEST_TOPIC_NAME}} -X brokers="'"$REDPANDA_BROKERS"'" -X tls.ca="{{.PATH_TO_CA_CRT}}" -v -o :end')
        echo "$testoutput" | grep squirrels || exit 1

  broker:extract:
    desc: Test broker extraction from hosts file
    cmds:
      - |
        REDPANDA_BROKERS=$(sed -n '/^\[redpanda\]/,/^\[/p' "{{.HOSTS_FILE}}" | grep '^[0-9]' | cut -d' ' -f1 | sed 's/$/:9092/' | paste -sd ',' -)
        echo "Extracted brokers: $REDPANDA_BROKERS"
        BROKER_COUNT=$(echo "$REDPANDA_BROKERS" | tr ',' '\n' | wc -l | tr -d ' ')
        echo "Broker count: $BROKER_COUNT"
        if echo "$REDPANDA_BROKERS" | grep -q "ansible_become" || [ -z "$REDPANDA_BROKERS" ]; then
          echo "❌ FAILED: Invalid broker list"
          exit 1
        fi
