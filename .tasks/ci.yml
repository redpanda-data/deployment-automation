version: '3'

vars:
  # Shared knobs for every collection-upgrade lane — defined once so a GA pin bump
  # or knob change is a single edit. Env vars (forwarded by the Buildkite docker
  # plugin) override via the self-referencing defaults; individual lanes can still
  # override per-task if ever needed.
  BASELINE_COLLECTION_REF: '{{.BASELINE_COLLECTION_REF | default "redpanda.cluster"}}'
  # candidate under test: unset -> requirements.yml; or a git branch
  # ("git+<url>,<branch>") or a released Galaxy version ("redpanda.cluster:0.12.0")
  CANDIDATE_COLLECTION_REF: '{{.CANDIDATE_COLLECTION_REF | default ""}}'
  # pinned across both phases of the stable upgrade lanes; the unstable lane ignores it
  REDPANDA_VERSION: '{{.REDPANDA_VERSION | default "26.1.11-1"}}'
  SEED_COUNT: '{{.SEED_COUNT | default "500"}}'
  UPGRADE_SENTINEL_TOPIC: '{{.UPGRADE_SENTINEL_TOPIC | default "upgrade-sentinel"}}'

tasks:
  # Composite workflows
  aws:rp:workflow:
    desc: Full AWS + Redpanda deployment workflow
    deps:
      - :tools:keygen
      - :infra:aws:build
      - :cluster:provision
      - :monitor:deploy
      - :monitor:console:deploy

  # AWS CI Workflows
  aws:rp:
    desc: >-
      CI workflow - AWS basic Redpanda, run as a COLLECTION UPGRADE test: build a cluster with the
      last released collection (Galaxy) at a pinned RP version and seed data, then re-converge with
      the candidate collection (requirements.yml) at the SAME pinned version and assert a safe
      re-converge (repo/key cutover, version unchanged, service healthy) + full data survival.
    vars:
      DISTRO: '{{.DISTRO | default "ubuntu-focal"}}'
    cmds:
      - defer:
          task: :infra:aws:destroy
      - task: :tools:keygen
      - task: :tools:rpk:install
      - task: :infra:aws:build
        vars: {DISTRO: "{{.DISTRO}}"}
      # install all requirements collections (candidate) + roles once
      - task: :ansible:prereqs
      # ---- Phase 1: last released collection, pinned RP version ----
      - task: :ansible:collection:override
        vars: {COLLECTION_REF: "{{.BASELINE_COLLECTION_REF}}"}
      - task: :cluster:provision
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :test:upgrade:capture:baseline
      - task: :test:upgrade:seed
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}"}
      - task: :test:upgrade:sabotage:keyring
      # ---- Phase 2: candidate collection (requirements.yml), SAME pinned RP version ----
      - task: :ansible:collection:candidate
        vars: {CANDIDATE_COLLECTION_REF: "{{.CANDIDATE_COLLECTION_REF}}"}
      - task: :cluster:provision
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :monitor:deploy
      - task: :monitor:console:deploy
      - task: :test:cluster
      - task: :test:upgrade:assert
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}"}
      - task: :infra:aws:destroy

  aws:rp:connect:
    desc: >-
      CI workflow - AWS Redpanda with Connect (Fedora/RPM), run as a COLLECTION UPGRADE test: build
      with the last released collection at a pinned RP version + seed data, then re-converge with the
      candidate collection at the SAME version and assert safe re-converge + data survival. Connect
      + the extra cluster are deployed once in phase 2.
    vars:
      ENABLE_CONNECT: "true"
      DISTRO: "43"
    cmds:
      - defer:
          task: :infra:aws:destroy
      - defer:
          task: :infra:extra:aws:destroy
      - task: :tools:keygen
      - task: :tools:rpk:install
      - task: :infra:aws:build
        vars: {ENABLE_CONNECT: "true", DISTRO: "43"}
      - task: :infra:extra:aws:copy
      - task: :infra:extra:aws:build
      - task: :ansible:prereqs
      # ---- Phase 1: last released collection, pinned RP version ----
      - task: :ansible:collection:override
        vars: {COLLECTION_REF: "{{.BASELINE_COLLECTION_REF}}"}
      - task: :cluster:provision
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :test:upgrade:capture:baseline
      - task: :test:upgrade:seed
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}"}
      - task: :test:upgrade:sabotage:keyring
      # ---- Phase 2: candidate collection, SAME pinned RP version ----
      - task: :ansible:collection:candidate
        vars: {CANDIDATE_COLLECTION_REF: "{{.CANDIDATE_COLLECTION_REF}}"}
      - task: :cluster:provision
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :connect:deploy
      - task: :monitor:deploy
      - task: :monitor:console:deploy
      - task: :test:cluster
      - task: :connect:connector:create
      - task: :test:spam
      - task: :test:upgrade:assert
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}"}
      - task: :infra:extra:aws:destroy
      - task: :infra:aws:destroy

  aws:rp:tiered:
    desc: >-
      CI workflow - AWS tiered storage (TLS), run as a COLLECTION UPGRADE test: build with the last
      released collection at a pinned RP version + seed data, then re-converge with the candidate
      collection at the SAME version and assert safe re-converge + data survival. TLS lanes pass
      RPK_EXTRA so seed/assert talk to the brokers over TLS.
    vars:
      TIERED_STORAGE_ENABLED: "true"
      RPK_EXTRA: '-X tls.ca={{.CA_CRT}}'
    cmds:
      - defer:
          task: :infra:aws:destroy
      - task: :tools:keygen
      - task: :tools:rpk:install
      - task: :infra:aws:build
        vars: {TIERED_STORAGE_ENABLED: "true"}
      - task: :ansible:prereqs
      # ---- Phase 1: last released collection, pinned RP version ----
      - task: :ansible:collection:override
        vars: {COLLECTION_REF: "{{.BASELINE_COLLECTION_REF}}"}
      - task: :cluster:tiered
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :test:upgrade:capture:baseline
      - task: :test:upgrade:seed
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}", RPK_EXTRA: "{{.RPK_EXTRA}}"}
      - task: :test:upgrade:sabotage:keyring
      # ---- Phase 2: candidate collection, SAME pinned RP version ----
      - task: :ansible:collection:candidate
        vars: {CANDIDATE_COLLECTION_REF: "{{.CANDIDATE_COLLECTION_REF}}"}
      - task: :cluster:tiered
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :monitor:deploy:tls
      - task: :monitor:console:deploy:tls
      - task: :test:cluster:tls
      - task: :test:storage:aws
      - task: :test:upgrade:assert
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}", RPK_EXTRA: "{{.RPK_EXTRA}}"}
      - task: :infra:aws:destroy

  aws:rp:sasl:
    desc: >-
      CI workflow - AWS Redpanda with SASL authorization. Single-phase: fresh-installs the
      CANDIDATE collection with kafka_enable_authorization, reconciles a test user + topic ACL
      via user_management, verifies enforcement (superuser ok, anonymous denied, ACL-scoped
      user constrained to its topic), performs a SASL-authenticated rolling restart via
      operation-rolling-restart.yml, and re-verifies enforcement and data access afterwards.
    vars:
      DISTRO: '{{.DISTRO | default "ubuntu-focal"}}'
      SASL_USER: admin
      SASL_PASSWORD: '{{.DEPLOYMENT_ID}}-sasl-pw'
      SASL_TEST_USER: apptest
      SASL_TEST_PASSWORD: '{{.DEPLOYMENT_ID}}-app-pw'
      SASL_TEST_TOPIC: apptopic
    cmds:
      - defer:
          task: :infra:aws:destroy
      - task: :tools:keygen
      - task: :tools:rpk:install
      - task: :infra:aws:build
        vars: {DISTRO: "{{.DISTRO}}"}
      - task: :ansible:prereqs
      - task: :ansible:collection:candidate
        vars: {CANDIDATE_COLLECTION_REF: "{{.CANDIDATE_COLLECTION_REF}}"}
      - task: :cluster:sasl
        vars:
          SASL_USER: "{{.SASL_USER}}"
          SASL_PASSWORD: "{{.SASL_PASSWORD}}"
      - task: :ops:users:apply
        vars:
          SASL_USER: "{{.SASL_USER}}"
          SASL_PASSWORD: "{{.SASL_PASSWORD}}"
          SASL_USERS_JSON: '{"sasl_users":[{"username":"{{.SASL_TEST_USER}}","password":"{{.SASL_TEST_PASSWORD}}","state":"present"}]}'
          SASL_ACLS_JSON: '{"sasl_acls":[{"principal":"{{.SASL_TEST_USER}}","operation":["read","write","describe"],"resource_type":"topic","resource_name":"{{.SASL_TEST_TOPIC}}","permission":"allow"}]}'
      - task: :test:cluster:sasl
        vars:
          SASL_USER: "{{.SASL_USER}}"
          SASL_PASSWORD: "{{.SASL_PASSWORD}}"
          SASL_TEST_USER: "{{.SASL_TEST_USER}}"
          SASL_TEST_PASSWORD: "{{.SASL_TEST_PASSWORD}}"
          SASL_TEST_TOPIC: "{{.SASL_TEST_TOPIC}}"
      # rolling restart with SASL credentials; enforcement and the app user's
      # data must survive it
      - task: :ops:broker:restart
        vars:
          SASL_USER: "{{.SASL_USER}}"
          SASL_PASSWORD: "{{.SASL_PASSWORD}}"
      - task: :test:cluster:sasl
        vars:
          SASL_USER: "{{.SASL_USER}}"
          SASL_PASSWORD: "{{.SASL_PASSWORD}}"
          SASL_TEST_USER: "{{.SASL_TEST_USER}}"
          SASL_TEST_PASSWORD: "{{.SASL_TEST_PASSWORD}}"
          SASL_TEST_TOPIC: "{{.SASL_TEST_TOPIC}}"
      - task: :infra:aws:destroy

  aws:rp:tiered:unstable:
    desc: >-
      CI workflow - AWS tiered storage (TLS) against the UNSTABLE Redpanda repo. Single-phase,
      NOT a collection-upgrade test: unstable has no stable version to pin across two converges
      (the GA pin doesn't exist in the unstable repo at all — see build 426). Instead this lane
      fresh-installs the CANDIDATE collection at the latest unstable version, covering the
      fresh-install path against the unstable repo.
    vars:
      TIERED_STORAGE_ENABLED: "true"
    cmds:
      - defer:
          task: :infra:aws:destroy
      - task: :tools:keygen
      - task: :tools:rpk:install
      - task: :infra:aws:build
        vars: {TIERED_STORAGE_ENABLED: "true"}
      - task: :ansible:prereqs
      - task: :ansible:collection:candidate
        vars: {CANDIDATE_COLLECTION_REF: "{{.CANDIDATE_COLLECTION_REF}}"}
      # IS_USING_UNSTABLE is pinned here (not in the Buildkite command) so a local
      # `task ci:aws:rp:tiered:unstable` also converges against the unstable repo.
      # No RP_VERSION pin: the playbook default (latest) tracks the unstable repo.
      - task: :cluster:tiered
        vars: {IS_USING_UNSTABLE: "true"}
      - task: :monitor:deploy:tls
        vars: {IS_USING_UNSTABLE: "true"}
      - task: :monitor:console:deploy:tls
        vars: {IS_USING_UNSTABLE: "true"}
      - task: :test:cluster:tls
      - task: :test:storage:aws
      - task: :infra:aws:destroy

  aws:rp:ts-connect:
    desc: >-
      CI workflow - AWS tiered storage + Connect (Fedora/RPM, TLS), run as a COLLECTION UPGRADE test:
      build with the last released collection at a pinned RP version + seed data, then re-converge
      with the candidate collection at the SAME version and assert safe re-converge + data survival.
      Connect + the extra cluster are deployed once in phase 2. TLS lanes pass RPK_EXTRA.
    vars:
      ENABLE_CONNECT: "true"
      TIERED_STORAGE_ENABLED: "true"
      DISTRO: "43"
      RPK_EXTRA: '-X tls.ca={{.CA_CRT}}'
    cmds:
      - defer:
          task: :infra:aws:destroy
      - defer:
          task: :infra:extra:aws:destroy
      - task: :tools:keygen
      - task: :tools:rpk:install
      - task: :infra:aws:build
        vars: {ENABLE_CONNECT: "true", TIERED_STORAGE_ENABLED: "true", DISTRO: "43"}
      - task: :ansible:prereqs
      # ---- Phase 1: last released collection, pinned RP version ----
      - task: :ansible:collection:override
        vars: {COLLECTION_REF: "{{.BASELINE_COLLECTION_REF}}"}
      - task: :cluster:tiered
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :test:upgrade:capture:baseline
      - task: :test:upgrade:seed
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}", RPK_EXTRA: "{{.RPK_EXTRA}}"}
      - task: :test:upgrade:sabotage:keyring
      # ---- Phase 2: candidate collection, SAME pinned RP version ----
      - task: :ansible:collection:candidate
        vars: {CANDIDATE_COLLECTION_REF: "{{.CANDIDATE_COLLECTION_REF}}"}
      - task: :cluster:tiered
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :connect:deploy:tls
      - task: :monitor:deploy:tls
      - task: :monitor:console:deploy:tls
      # extra cluster is built here, right before its only consumer — building it up
      # front left it idle (billing) through both converge phases + seed, and let a
      # transient extra-infra failure kill the run before any upgrade signal existed.
      # :infra:extra:aws:copy runs via the build task's deps.
      - task: :infra:extra:aws:build
      - task: :cluster:extra:provision
      - task: :test:cluster:tls
      - task: :test:storage:aws
      - task: :test:connect:tls
      - task: :connect:connector:create:tls
      - task: :test:spam:tls
      - task: :test:upgrade:assert
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}", RPK_EXTRA: "{{.RPK_EXTRA}}"}
      - task: :infra:aws:destroy
      - task: :infra:extra:aws:destroy

  # GCP CI Workflows
  gcp:rp:
    desc: >-
      CI workflow - GCP basic Redpanda, run as a COLLECTION UPGRADE test: build with the last
      released collection (Galaxy) at a pinned RP version + seed data, then re-converge with the
      candidate collection (requirements.yml) at the SAME version and assert safe re-converge + data
      survival. NOTE: on GCP install-rp-deb.yml sets allow_unauthenticated=true, so a bad apt
      signature is ignored — GCP validates the workflow STRUCTURE + data survival, but the GPG key
      cutover itself is only trustworthy on the AWS lane.
    vars:
    cmds:
      - defer:
          task: :infra:gcp:destroy
      - task: :tools:keygen
      - task: :tools:rpk:install
      - task: :infra:gcp:build
      - task: :ansible:prereqs
      # ---- Phase 1: last released collection, pinned RP version ----
      - task: :ansible:collection:override
        vars: {COLLECTION_REF: "{{.BASELINE_COLLECTION_REF}}"}
      - task: :cluster:provision
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :test:upgrade:capture:baseline
      - task: :test:upgrade:seed
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}"}
      - task: :test:upgrade:sabotage:keyring
      # ---- Phase 2: candidate collection (requirements.yml), SAME pinned RP version ----
      - task: :ansible:collection:candidate
        vars: {CANDIDATE_COLLECTION_REF: "{{.CANDIDATE_COLLECTION_REF}}"}
      - task: :cluster:provision
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :monitor:deploy
      - task: :monitor:console:deploy
      - task: :test:cluster
      - task: :test:upgrade:assert
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}"}
      - task: :infra:gcp:destroy

  gcp:rp:tiered:
    desc: >-
      CI workflow - GCP tiered storage (TLS), run as a COLLECTION UPGRADE test: build with the last
      released collection at a pinned RP version + seed data, then re-converge with the candidate
      collection at the SAME version and assert safe re-converge + data survival. TLS lanes pass
      RPK_EXTRA so seed/assert talk to the brokers over TLS. (GCP masks the GPG cutover via
      allow_unauthenticated; it validates structure + TLS + data survival.)
    vars:
      TIERED_STORAGE_ENABLED: "true"
      RPK_EXTRA: '-X tls.ca={{.CA_CRT}}'
    cmds:
      - defer:
          task: :infra:gcp:destroy
      - task: :tools:keygen
      - task: :tools:rpk:install
      - task: :infra:gcp:build
        vars: {TIERED_STORAGE_ENABLED: "true"}
      - task: :ansible:prereqs
      # ---- Phase 1: last released collection, pinned RP version ----
      - task: :ansible:collection:override
        vars: {COLLECTION_REF: "{{.BASELINE_COLLECTION_REF}}"}
      - task: :cluster:tiered
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :test:upgrade:capture:baseline
      - task: :test:upgrade:seed
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}", RPK_EXTRA: "{{.RPK_EXTRA}}"}
      - task: :test:upgrade:sabotage:keyring
      # ---- Phase 2: candidate collection, SAME pinned RP version ----
      - task: :ansible:collection:candidate
        vars: {CANDIDATE_COLLECTION_REF: "{{.CANDIDATE_COLLECTION_REF}}"}
      - task: :cluster:tiered
        vars: {RP_VERSION: "{{.REDPANDA_VERSION}}", RP_INSTALL_STATUS: "present"}
      - task: :monitor:deploy:tls
      - task: :monitor:console:deploy:tls
      - task: :test:cluster:tls
      - task: :test:storage:gcp
      - task: :test:upgrade:assert
        vars: {UPGRADE_SENTINEL_TOPIC: "{{.UPGRADE_SENTINEL_TOPIC}}", SEED_COUNT: "{{.SEED_COUNT}}", RPK_EXTRA: "{{.RPK_EXTRA}}"}
      - task: :infra:gcp:destroy

  # Extra deployment workflows
  extra:rp:
    desc: Deploy secondary Redpanda cluster
    cmds:
      - task: :infra:extra:aws:build
      - task: :cluster:extra:provision

  extra:rp:tls:
    desc: Deploy secondary cluster with TLS
    cmds:
      - task: :infra:extra:aws:build
      - task: :cluster:extra:tls
      - task: :monitor:extra:deploy:tls
      - task: :monitor:console:extra:deploy:tls
